<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orb-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orb-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.55; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); }
        100% { transform: translateY(400px); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 250px 150px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 950px 250px; }
      .p1 { animation: floatParticle 4s ease-in-out infinite; }
      .p2 { animation: floatParticle 6s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 5s ease-in-out infinite 2s; }
      .flow-path { stroke-dasharray: 8, 8; animation: flowDash 3s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Background Orbs -->
  <circle class="orb-1" cx="220" cy="140" r="180" fill="url(#orb-grad-1)" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="260" r="220" fill="url(#orb-grad-2)" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#cyber-grid)" rx="16" />

  <!-- Dynamic Cyber Wave / Stream Lines in Background -->
  <g opacity="0.35">
    <path class="flow-path" d="M 50 320 C 300 240, 500 380, 750 300 S 1050 200, 1150 260" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <path class="flow-path" d="M 50 340 C 320 270, 520 400, 770 320 S 1030 220, 1150 280" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <path class="flow-path" d="M 50 360 C 280 290, 480 420, 730 340 S 1000 240, 1150 300" fill="none" stroke="#3b82f6" stroke-width="1.5" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="150" cy="80" r="3" fill="#a855f7" />
  <circle class="p2" cx="1080" cy="100" r="4" fill="#38bdf8" />
  <circle class="p3" cx="920" cy="340" r="2.5" fill="#f472b6" />
  <circle class="p1" cx="280" cy="330" r="3.5" fill="#818cf8" />
  <circle class="p2" cx="80" cy="240" r="2" fill="#c084fc" />

  <!-- Foreground Content: Header Tag / Pill -->
  <g transform="translate(600, 75)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="-135" cy="0" r="5" fill="#10b981" />
    <text class="badge-text" x="-115" y="5" font-size="13" fill="#94a3b8" letter-spacing="1.5">CURATED AI VIDEO ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(600, 155)">
    <text class="title-text" x="0" y="0" text-anchor="middle" font-size="44" fill="url(#primary-grad)" filter="drop-shadow(0px 4px 12px rgba(139, 92, 246, 0.35))">
      AI Video Generation &amp; Code-to-Video
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 215)">
    <text class="sub-text" x="0" y="0" text-anchor="middle" font-size="20" fill="#f8fafc" letter-spacing="0.5">
      Programmatic Rendering &#8226; Video Foundation Models &#8226; AI Avatars &#8226; GPU Pipelines
    </text>
    <text class="sub-text" x="0" y="32" text-anchor="middle" font-size="14" fill="#94a3b8">
      Curated rankings, SaaS pricing transparency, enterprise valuations &amp; verified open-source GitHub stars
    </text>
  </g>

  <!-- Feature Highlights / Pills in Foreground -->
  <g transform="translate(600, 315)">
    <!-- Pill 1 -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="0" width="165" height="38" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1" />
      <text class="badge-text" x="82.5" y="24" text-anchor="middle" font-size="13" fill="#c7d2fe">⚡ React &amp; Python Code</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-185, 0)">
      <rect x="0" y="0" width="175" height="38" rx="10" fill="#3b0764" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" />
      <text class="badge-text" x="87.5" y="24" text-anchor="middle" font-size="13" fill="#e9d5ff">🎬 Diffusion Video DiTs</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="175" height="38" rx="10" fill="#4c0519" fill-opacity="0.85" stroke="#f43f5e" stroke-width="1" />
      <text class="badge-text" x="87.5" y="24" text-anchor="middle" font-size="13" fill="#fecdd3">🗣️ Talking Heads &amp; Sync</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="165" height="38" rx="10" fill="#082f49" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1" />
      <text class="badge-text" x="82.5" y="24" text-anchor="middle" font-size="13" fill="#bae6fd">🖥️ ComfyUI &amp; Local GPU</text>
    </g>
  </g>
</svg>
