<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="orb-grad-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><linearGradient id="orb-grad-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(-15px,10px);opacity:.55}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes flowDash{0%{stroke-dashoffset:100}}@keyframes scanline{0%{transform:translateY(0)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:250px 150px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:950px 250px}.p1{animation:floatParticle 4s ease-in-out infinite}.p2{animation:floatParticle 6s ease-in-out infinite 1s}.p3{animation:floatParticle 5s ease-in-out infinite 2s}.f