xt-anchor="middle" transform="translate(600, 215)">Programmatic Rendering • Video Foundation Models • AI Avatars • GPU Pipelines</text><text x="0" y="32" fill="#94a3b8" class="sub-text" font-size="14" text-anchor="middle" transform="translate(600, 215)">Curated rankings, SaaS pricing transparency, enterprise valuations &amp; verified open-source GitHub stars</text></g><g><g transform="translate(600, 315) translate(-370, 0)"><rect width="165" height="38" x="0" y="0" fill="#1e1b4b" fill-opacity=".85" stroke="#6366f1" stroke-width="1" rx="10"/><text x="82.5" y="24" fill="#c7d2fe" class="badge-text" font-size="13" text-anchor="middle">⚡ React &amp; Python Code</text></g><g transform="translate(600, 315) translate(-185, 0)"><rect width="175" height="38" x="0" y="0" fill="#3b0764" fill-opacity=".85" stroke="#a855f7" stroke-width="1" rx="10"/><text x="87.5" y="24" fill="#e9d5ff" class="badge-text" font-size="13" text-anchor="middle">🎬 Diffusion Video DiTs</text></g><g transform="translate(600, 315) translate(10, 0)"><rect width="175" height="38" x="0" y="0" fill="#4c0519" fill-opacity=".85" stroke="#f43f5e" stroke-width="1" rx="10"/><text x="87.5" y="24" fill="#fecdd3" class="badge-text" font-size="13" text-anchor="middle">🗣️ Talking Heads &amp; Sync</text></g><g transform="translate(600, 315) translate(205, 0)"><rect width="165" height="38" x="0" y="0" fill="#082f49" fill-opacity=".85" stroke="#0ea5e9" stroke-width="1" rx="10"/><text x="82.5" y="24" fill="#bae6fd" class="badge-text" font-size="13" text-anchor="middle">🖥️ ComfyUI &amp; Local GPU</text></g></g></svg>